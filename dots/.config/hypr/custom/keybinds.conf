# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

##! AZERTY FR overrides
# Keep kb_layout=us but remap to FR symbols/positions with keycodes.
bindd = Super+Shift, code:59, Emoji >> clipboard, global, quickshell:overviewEmojiToggle # Emoji >> clipboard
bind = Super, code:24, global, quickshell:sidebarLeftToggle # Toggle left sidebar
bind = Super+Alt, code:24, global, quickshell:sidebarLeftToggleDetach # [hidden]
bindd = Super, code:61, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet
bindd = Super, code:47, Toggle media controls, global, quickshell:mediaControlsToggle # Toggle media controls
bind = Shift+Super+Alt, code:60, exec, qs -p ~/.config/quickshell/$qsConfig/welcome.qml # [hidden] Launch welcome app
bindld = Super+Shift, code:47, Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle # [hidden]
bindld = Super+Alt, code:47, Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindd = Super+Shift, code:59, Copy an emoji, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || ~/.config/hypr/hyprland/scripts/fuzzel-emoji.sh copy # [hidden] Emoji >> clipboard (fallback)
bind = Super+Shift, code:24, global, quickshell:regionSearch # Google Lens
bind = Super+Shift, code:24, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || ~/.config/hypr/hyprland/scripts/snip_to_search.sh # [hidden] Google Lens (fallback)
bind = Super, code:38, killactive, # Close
bind = Super+Shift+Alt, code:38, exec, hyprctl kill # Forcefully zap a window
binde = Super, code:59, splitratio, -0.1 # [hidden]
binde = Super, code:13, splitratio, +0.1 # [hidden]
bind = Super+Alt, code:21, exec, notify-send "Urgent notification" "Ah hell no" -u critical -a 'Hyprland keybind' # [hidden]
binde = Super, code:15, exec, qs -c $qsConfig ipc call zoom zoomOut # Zoom out
binde = Super, code:21, exec, qs -c $qsConfig ipc call zoom zoomIn # Zoom in
binde = Super, code:15, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1 # [hidden] Zoom out
binde = Super, code:21, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1 # [hidden] Zoom in
bind = Super, code:52, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser
bind = Ctrl+Super+Shift+Alt, code:52, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "wps" "onlyoffice-desktopeditors" "libreoffice" # Office software

